<!doctype html>
<html lang="pt-BR"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedido de Cotação Portal ComexRio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2E5C;--navy2:#06305B;--laranja:#E9672B;--cinza:#F0ECE5;--fio:#0A2E5C26;--apoio:#44597a}
*{box-sizing:border-box}
body{margin:0;background:var(--cinza);color:var(--navy);font-family:Manrope,Arial,sans-serif;line-height:1.4}
main{max-width:1120px;margin:0 auto;padding:32px 16px 48px}
.selo{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:3px}
.selo i{width:12px;height:12px;background:var(--laranja)}
h1{font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.05;letter-spacing:-1px;margin:18px 0 8px}
.apoio{font-size:17px;font-weight:500;color:var(--apoio);margin:0 0 28px;max-width:720px}
.grade{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start}
form{background:#fff;border:1px solid var(--fio);padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.todo{grid-column:1/-1}
input,select,textarea{font:600 16px Manrope,Arial;padding:12px;border:1px solid #c9d1de;background:#fff;color:var(--navy);width:100%}
textarea{min-height:110px;resize:vertical;font-weight:500}
button{grid-column:1/-1;font:800 16px Manrope,Arial;background:var(--laranja);color:var(--navy);border:0;padding:15px;cursor:pointer}
aside{background:var(--navy);color:#fff;padding:24px}
aside h2{margin:0 0 4px;font-size:22px;font-weight:800}
aside p{margin:0 0 16px;font-size:14px;font-weight:500;color:#c9d1de}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--navy2);padding:12px 14px;font-weight:700;font-size:15px}
#ok{display:none;margin-top:16px;background:var(--laranja);color:var(--navy);padding:16px;font-weight:800}
@media(max-width:820px){.grade,form{grid-template-columns:1fr}}

/* visual do brandbook dos motions */
body{background:#F0ECE5}h1,h2,h3{letter-spacing:-.02em}button,.botao,input,select{border-radius:14px}
</style></head><body><main>
<div class="selo"><i></i>PORTAL COMEXRIO</div>
<h1>Peça uma cotação para vários fornecedores de uma vez</h1>
<p class="apoio">Descreva o que você precisa. O pedido vai para os fornecedores do segmento no guia do Portal.</p>
<div class="grade">
<form id="f">
<label>Serviço<select id="serv" required></select></label>
<label>Local da operação<select id="local" required>
<option>Porto do Rio de Janeiro</option><option>Porto de Itaguaí</option><option>Porto de Niterói</option><option>Porto de Angra dos Reis</option><option>Porto do Açu</option><option>Rio Galeão Cargo</option><option>Outro local no RJ</option>
</select></label>
<label class="todo">O que você precisa?<textarea id="desc" required placeholder="Tipo de carga, volume, prazo"></textarea></label>
<label>Empresa<input id="emp" required></label>
<label>E-mail<input id="mail" type="email" required></label>
<button>Enviar pedido</button>
</form>
<aside>
<h2 id="tit"></h2><p>Fornecedores do guia neste segmento</p>
<ul id="lista" aria-live="polite"></ul>
<div id="ok" role="status"></div>
</aside>
</div>
</main>
<script>
const F={'Agência marítima':['All Flags'],'Agente de carga':['Avx Logística'],'Consultoria':['MGP Engenharia','PIER 3'],'Despachante aduaneiro':['Brasil Despachos'],'Empresa de engenharia':['PIER 3'],'Marketing':['IdentiKa Propaganda'],'Operador portuário':['Gavea Group','TPAR']};
const $=i=>document.getElementById(i);
$('serv').innerHTML=Object.keys(F).map(s=>`<option>${s}</option>`).join('');
function pinta(){const l=F[$('serv').value];$('tit').textContent=l.length==1?'1 fornecedor recebe':`${l.length} fornecedores recebem`;$('lista').innerHTML=l.map(n=>`<li>${n}</li>`).join('');$('ok').style.display='none'}
$('serv').onchange=pinta;pinta();
$('f').onsubmit=e=>{e.preventDefault();const n=F[$('serv').value].length;$('ok').style.display='block';$('ok').textContent=`Pedido pronto para ${n} ${n==1?'fornecedor':'fornecedores'}. Protótipo: nada foi enviado.`};
</script></body></html>
