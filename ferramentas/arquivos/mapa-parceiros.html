<!doctype html><html lang="pt-BR"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa de Parceiros Portal ComexRio</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body,#map{margin:0;height:100%;background:#06305B;font-family:Manrope,Arial,sans-serif}
.titulo{position:absolute;left:24px;top:24px;z-index:2;background:#0A2E5Cf2;color:#fff;padding:14px 20px;font-weight:800;font-size:20px;border:0;text-align:left;font-family:inherit}
.titulo small{display:block;margin-top:4px;font-weight:500;font-size:13px;color:#c9d1de}
.titulo.volta{cursor:pointer}
.pin{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.pin i{position:relative;width:16px;height:16px;border-radius:50%;background:#E9672B;border:3px solid #fff;display:block}
.pin b{background:#0A2E5Cf2;color:#fff;padding:5px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.pin:hover b,.pin:focus-visible b{background:#E9672B;color:#0A2E5C}
.pin.puff i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid #E9672B;animation:puff .9s ease-out}
@keyframes puff{to{transform:scale(7);opacity:0}}
.infra{display:flex;align-items:center;gap:7px;cursor:pointer;background:none;border:0;padding:6px;margin:-6px;font-family:inherit}
.infra i{width:12px;height:12px;border-radius:50%;background:#0085CF;border:2px solid #fff;display:block}
.infra b{background:#fffffff2;color:#0A2E5C;padding:4px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.infra.so b{display:none}
.infra:hover b,.infra:focus-visible b{display:block;background:#0085CF;color:#fff}
.leg{position:absolute;left:24px;bottom:24px;z-index:2;background:#0A2E5Cf2;color:#fff;padding:10px 14px;font-size:13px;font-weight:600;display:flex;gap:16px}
.leg span{display:flex;align-items:center;gap:7px}.leg i{width:11px;height:11px;border-radius:50%;border:2px solid #fff;display:block}
@media(max-width:700px){.leg{left:12px;bottom:12px;top:auto}}
.bolha{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;padding:0;background:none;font-family:inherit}
.bolha i{width:52px;height:52px;border-radius:50%;background:#E9672B;color:#0A2E5C;font:800 22px Manrope,Arial;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 6px #E9672B44}
.bolha b{background:#0A2E5Cf2;color:#fff;padding:6px 12px;font-size:15px;font-weight:800;white-space:nowrap}
.uf{color:#fff;font-weight:800;font-size:18px;letter-spacing:3px;text-shadow:0 1px 6px #000;pointer-events:none}
.ficha{position:absolute;right:24px;top:24px;width:340px;max-height:calc(100% - 68px);background:#0A2E5C;color:#fff;z-index:2;transform:translateX(420px);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:auto}
.ficha.on{transform:none}
.ficha img{width:100%;height:190px;object-fit:cover;background:#F0ECE5;display:block}
.ficha div{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.ficha small{color:#E9672B;font-weight:800;letter-spacing:2px;font-size:12px;text-transform:uppercase}
.ficha h2{margin:0;font-size:28px;line-height:1.1;font-weight:800}
.ficha p{margin:0;font-size:16px;line-height:1.4;font-weight:500;color:#F0ECE5}
.ficha a{margin-top:8px;padding:13px;text-align:center;background:#E9672B;color:#0A2E5C;font-weight:800;font-size:15px;text-decoration:none}
.ficha button{background:none;border:1px solid #c9d1de;color:#F0ECE5;padding:11px;font:700 14px Manrope,Arial;cursor:pointer}
@media(max-width:700px){.ficha{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:62%;transform:translateY(120%)}.ficha img{height:110px}.titulo{left:12px;top:12px}}

/* visual do brandbook dos motions */
body{background:#F0ECE5}h1,h2,h3{letter-spacing:-.02em}button,.botao,input,select{border-radius:14px}
